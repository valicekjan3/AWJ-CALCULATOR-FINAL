<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWJ Kalkulačka - Test Verze</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: #f0f0f0;
        }
        .status {
            background: #4CAF50;
            color: white;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        .error {
            background: #f44336;
        }
    </style>
</head>
<body>
    <h1>AWJ Kalkulačka - Test</h1>
    <div id="status" class="status">Testování...</div>

    <div id="results"></div>

    <script>
        const results = document.getElementById('results');
        const status = document.getElementById('status');

        let testsPassed = 0;
        let testsFailed = 0;

        function test(name, condition) {
            const div = document.createElement('div');
            if (condition) {
                testsPassed++;
                div.style.color = 'green';
                div.textContent = `✓ ${name}`;
            } else {
                testsFailed++;
                div.style.color = 'red';
                div.textContent = `✗ ${name}`;
            }
            results.appendChild(div);
        }

        // Test 1: Soubory existují
        test('HTML soubor načten', document.querySelector('body') !== null);

        // Test 2: Script by měl být načten
        setTimeout(() => {
            test('Timeout funguje', true);

            // Zobrazit výsledek
            if (testsFailed === 0) {
                status.textContent = `Všechny testy prošly (${testsPassed}/${testsPassed})`;
                status.className = 'status';
            } else {
                status.textContent = `Některé testy selhaly (${testsPassed}/${testsPassed + testsFailed})`;
                status.className = 'status error';
            }
        }, 100);
    </script>
</body>
</html>
